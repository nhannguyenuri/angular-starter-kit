<section class="grid h-dvh w-full grid-cols-12">
  <header class="col-span-full h-16">
    <app-nav-bar />
  </header>

  <aside class="col-span-4 h-[calc(100dvh-4rem)] lg:col-span-2" [ngClass]="{ 'hidden!': !appNavStore.isShowNavList() }">
    <app-nav-list />
  </aside>

  <main class="col-span-8 h-[calc(100dvh-4rem)] lg:col-span-10" [ngClass]="{ 'col-span-full!': !appNavStore.isShowNavList() }">
    <section class="h-full w-full">
      <router-outlet />
    </section>
  </main>
</section>
