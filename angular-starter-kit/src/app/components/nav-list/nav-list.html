<ol class="flex h-full flex-col overflow-auto bg-gray-100">
  @for (item of navItems(); track item.label) {
    <li [routerLink]="[item.path]" routerLinkActive="nav-link-activated" class="flex h-12 cursor-pointer items-center px-4 font-semibold hover:bg-black hover:text-white">
      {{ item.label }}
    </li>
  }
</ol>
